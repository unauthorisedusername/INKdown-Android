name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Collect web files into www
        run: |
          mkdir www
          cp index.html *.js *.css *.woff *.wasm www/
      - run: npm install
      - name: Add Capacitor JS runtime to the web app
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          sed -i 's#<script src="native.js"></script>#<script src="capacitor.js"></script><script src="native.js"></script>#' www/index.html
          grep -c 'src="capacitor.js"' www/index.html
      - run: npx cap add android
      - name: Add native "Save as" plugin
        run: |
          D=android/app/src/main/java/com/inkdown/dj
          cp SaveFilePlugin.java $D/SaveFilePlugin.java
          cat > $D/MainActivity.java <<'JAVA'
          package com.inkdown.dj;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SaveFilePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: notes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
